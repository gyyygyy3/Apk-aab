
name: Convert AAB to APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check AAB
        run: |
          test -f app.aab || {
            echo "app.aab not found"
            exit 1
          }

      - name: Download Bundletool
        run: |
          URL=$(curl -fsSL https://api.github.com/repos/google/bundletool/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1)
          test -n "$URL"
          curl -fL "$URL" -o bundletool.jar

      - name: Generate signing key
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Convert AAB to APK
        run: |
          java -jar bundletool.jar build-apks \
            --bundle=app.aab \
            --output=app.apks \
            --mode=universal \
            --ks=debug.keystore \
            --ks-pass=pass:android \
            --ks-key-alias=androiddebugkey \
            --key-pass=pass:android
          unzip -o app.apks universal.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Converted-APK
          path: universal.apk
          retention-days: 7
